<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elevator-Simulator</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js"></script>
  </head>
  <body id="body" class="body">
    <h1>Elevator Simulator</h1>
    <div id="main" class="main">
      <div id="sim" class="sim">
        <div id="button" class="button">
          <div class="block-1" id="block-1">
            <div class="btn" id="btn-10">10</div>
            <div class="btn" id="btn-9">9</div>
            <div class="btn" id="btn-8">8</div>
            <div class="btn" id="btn-7">7</div>
            <div class="btn" id="btn-6">6</div>
          </div>
          <div class="block-2" id="block-2">
            <div class="btn" id="btn-5">5</div>
            <div class="btn" id="btn-4">4</div>
            <div class="btn" id="btn-3">3</div>
            <div class="btn" id="btn-2">2</div>
            <div class="btn" id="btn-1">1</div>
          </div>
        </div>
        <div id="elevator" class="elevator">
          <div id="floor" class="floor">
            <div id="fl-10" class="flr"></div>
            <div id="fl-9" class="flr"></div>
            <div id="fl-8" class="flr"></div>
            <div id="fl-7" class="flr"></div>
            <div id="fl-6" class="flr"></div>
            <div id="fl-5" class="flr"></div>
            <div id="fl-4" class="flr"></div>
            <div id="fl-3" class="flr"></div>
            <div id="fl-2" class="flr"></div>
            <div id="fl-1" class="flr"></div>
          </div>
          <div id="elev" class="elev"></div>
        </div>
      </div>
    </div>
  </body>
</html>
